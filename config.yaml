# Settings and services of the YesWiki extension accountactivationbyemail, see LICENSE.
parameters:
  signup_email_activation: true
  user_activation_key_length: 20
  signup_refuse_disposable_email: true
  signup_disposable_email_domains: ''
  signup_refuse_spam: true
  signup_spam_threshold: 3
  signup_spam_words: ''
  signup_spam_contact: ''
  signup_mattermost_webhook: ''
  unactivated_account_lifetime: 3
  accountactivationbyemail_editable_config_params:
    - 'signup_email_activation'
    - 'user_activation_key_length'
    - 'signup_refuse_disposable_email'
    - 'signup_disposable_email_domains'
    - 'signup_refuse_spam'
    - 'signup_spam_threshold'
    - 'signup_spam_words'
    - 'signup_spam_contact'
    - 'signup_mattermost_webhook'
    - 'unactivated_account_lifetime'

services:
  _defaults:
    autowire: true
    public: true

  YesWiki\Accountactivationbyemail\Service\:
    resource: 'services/*'

  YesWiki\Accountactivationbyemail\Controller\:
    resource: 'controllers/*'

  YesWiki\Accountactivationbyemail\Controller\AuthController:
    decorates: YesWiki\Core\Controller\AuthController
    decoration_on_invalid: ignore

  YesWiki\Accountactivationbyemail\Controller\UserController:
    decorates: YesWiki\Core\Controller\UserController
    decoration_on_invalid: ignore
